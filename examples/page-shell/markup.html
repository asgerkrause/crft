<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A minimal crft page shell with landmarks and a section container.">
    <title>Page shell — crft example</title>
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="./example.css">
  </head>
  <body>
    <a class="sr focusable" href="#main">Skip to content</a>

    <header>
      <div class="c s">
        <p>Page shell</p>
        <nav aria-label="Page">
          <ul>
            <li><a href="#content">Content</a></li>
            <li><a href="#notes">Notes</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main id="main" tabindex="-1">
      <section id="page-content">
        <div class="c s">
          <h1 id="content" tabindex="-1">Page content</h1>
          <p>This headed section groups the main content. Its container sets the content measure and the named query boundary.</p>
        </div>
      </section>
    </main>

    <footer id="notes" tabindex="-1">
      <div class="c">
        <p>Page notes. Header, main, and footer stay in source order at every width.</p>
      </div>
    </footer>
  </body>
</html>
